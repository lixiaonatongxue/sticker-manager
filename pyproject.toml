[project]
name = "sticker-manager"
version = "0.1.0"
description = "Sticker Manager 表情包管家 —— 纯本地微信表情包去重 / 搜索 / 批量导出工具（只读、不联网）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sticker-manager = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
